name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: astral-sh/uv-setup@v1
      with:
        cache-dependency-path: uv.lock
    
    - name: Install dependencies
      run: uv pip install -e .[dev]
    
    - name: Run tests
      run: uv run pytest --cov=src/pickal --cov-report=term-missing
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: astral-sh/uv-setup@v1
      with:
        cache-dependency-path: uv.lock
    
    - name: Install dependencies
      run: uv pip install -e .[dev]
    
    - name: Run ruff check
      run: uv run ruff check src tests
    
    - name: Run mypy
      run: uv run mypy src

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: astral-sh/uv-setup@v1
      with:
        cache-dependency-path: uv.lock
    
    - name: Install dependencies
      run: uv pip install -e .[dev]
    
    - name: Build distribution
      run: uv build --wheel --out-dir dist/lib
    
    - name: Create tarball
      run: |
        mkdir -p dist/dist
        cp uv.lock dist/dist/
        cp bin/bootstrap_shim.sh dist/dist/
        tar -czf dist/pickal-$(python -c "import pickal; print(pickal.__version__)" 2>/dev/null || echo "0.1.0").tar.gz -C dist/dist .
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: distribution
        path: dist/*.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: astral-sh/uv-setup@v1
      with:
        cache-dependency-path: uv.lock
    
    - name: Install dependencies
      run: uv pip install -e .[dev]
    
    - name: Semantic Release
      run: |
        npx -y semantic-release@21
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}